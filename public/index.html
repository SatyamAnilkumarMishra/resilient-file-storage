<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resilient Distributed File Storage</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top-bar">
    <div class="top-bar-inner">
      <h1 class="brand">Resilient Distributed File Storage Platform</h1>
      <div id="authStatus" class="auth-status">
        <span id="userEmailDisplay" class="user-email"></span>
        <button id="signOutBtn" class="btn-link" style="display:none;">Sign out</button>
      </div>
    </div>
  </header>

  <main class="app-container">
    <div class="app-layout">
      <!-- Left Column: Controls and Status -->
      <div class="left-panel">
        
        <!-- Auth Panel -->
        <section id="authPanel" class="card">
          <h2 class="section-title">Sign in</h2>
          <form id="authForm" class="auth-form">
            <div class="form-group">
              <label for="emailInput">Email address</label>
              <input type="email" id="emailInput" required autocomplete="email" placeholder="user@example.com">
            </div>
            <div class="form-group">
              <label for="passwordInput">Password</label>
              <input type="password" id="passwordInput" required autocomplete="current-password" placeholder="••••••••">
            </div>
            <div class="form-actions">
              <button type="submit" id="signInSubmitBtn" class="btn btn-primary">Sign in</button>
              <button type="button" id="registerSubmitBtn" class="btn btn-secondary">Register account</button>
            </div>
            <div id="authError" class="alert alert-error" style="display:none;" role="alert"></div>
          </form>
        </section>

        <!-- Uploader Panel -->
        <div id="uploaderPanel" style="display:none;">
          
          <!-- Dropzone -->
          <section class="card">
            <div id="dropzone" class="dropzone" tabindex="0" role="region" aria-label="File upload dropzone">
              <p class="dropzone-text">Drag and drop a file here or</p>
              <button type="button" id="chooseFileBtn" class="btn btn-secondary">Choose a file</button>
              <input type="file" id="fileInput" class="file-input-hidden">
            </div>
          </section>

          <!-- File Information & Status -->
          <section id="fileInfoSection" class="card" style="display:none;">
            <h2 class="section-title">Selected file</h2>
            <dl class="data-list">
              <div class="data-row">
                <dt>File name</dt>
                <dd id="infoFileName">-</dd>
              </div>
              <div class="data-row">
                <dt>File size</dt>
                <dd id="infoFileSize">-</dd>
              </div>
              <div class="data-row">
                <dt>Content type</dt>
                <dd id="infoContentType">-</dd>
              </div>
              <div class="data-row">
                <dt>SHA-256 hash</dt>
                <dd id="infoFileHash" class="code-text" title="">-</dd>
              </div>
              <div class="data-row">
                <dt>Total chunks</dt>
                <dd id="infoTotalChunks">-</dd>
              </div>
            </dl>
          </section>
